server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # Cache assets (fingerprinted filenames) for 1 year
    location ~* \.(js|css|png|jpg|woff2|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The Sarvam proxy in api/ is a Vercel serverless function and does not
    # exist in this image, so AI features are unavailable in the Docker build
    # (route search still works). Answer honestly instead of letting the SPA
    # fallback return index.html to a fetch() expecting JSON.
    #
    # To enable AI features here, run a proxy that injects the key and
    # proxy_pass /api/ to it.
    location /api/ {
        default_type application/json;
        return 501 '{"error":"No Sarvam proxy in this build. Deploy to Vercel, or proxy /api/ to your own key-injecting service."}';
    }

    # SPA fallback — let React Navigation handle all routes client-side
    location / {
        try_files $uri $uri/ /index.html;
    }
}
